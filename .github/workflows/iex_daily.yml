name: IEX daily closes

on:
  # 평소에는 Supabase pg_cron이 15:00 KST(화~토)에 workflow_dispatch로 실행한다 (앱 저장소 supabase/migrations/004_iex_dispatch.sql).
  # GitHub 예약 실행은 몇 시간씩 늦어서(실측 5~7시간) 그쪽이 실패했을 때를 위한 예비로만 둔다. 이미 처리한 날이면 기다리지 않고 끝난다.
  # IEX DEEP 공개 시각이 날마다 달라서(실측 15:30, 17:08 KST) 새 파일이 나올 때까지 최대 5시간 기다렸다가 처리한다.
  schedule:
    - cron: "37 8 * * 2-6"
  workflow_dispatch:
    inputs:
      date:
        description: "YYYYMMDD (비우면 저장된 마지막 날짜 다음 파일을 기다려 처리)"
        required: false

permissions:
  contents: write

concurrency:
  group: iex-daily

jobs:
  closes:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Parse IEX DEEP
        env:
          DATE: ${{ inputs.date }}
        run: |
          if [ -n "$DATE" ]; then
            python pipeline/iex_daily/iex_closes.py "$DATE" --out-dir data/iex
          else
            python pipeline/iex_daily/iex_closes.py --out-dir data/iex --wait-new 5
          fi
      - name: Compute signals
        env:
          SEC_USER_AGENT: "jigeumidat ${{ github.repository_owner }}@users.noreply.github.com"
        run: python pipeline/signals/compute_signals.py
      - name: Similar periods
        run: python pipeline/signals/similar_periods.py
      - name: Commit result
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/iex data/signals
          if git diff --cached --quiet; then
            echo "저장할 새 파일 없음"
          else
            git commit -m "IEX closes $(git diff --cached --name-only data/iex | sed 's/.*iex_//; s/.csv//' | tr '\n' ' ')"
            git pull --rebase
            git push
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      # 내 신호 푸시 알림: 기준을 새로 넘은 종목을 사용자마다 묶어 보낸다 (Secrets가 없으면 건너뜀)
      - name: Send signal alerts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python pipeline/alerts/send_alerts.py
      # 매일 업데이트 알림: 새 데이터를 올린 실행에서만, 반영 직후 바로 보낸다 (같은 날 다시 돌아도 두 번 가지 않게)
      - name: Send daily update
        if: steps.commit.outputs.new == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python pipeline/alerts/send_alerts.py --daily-update
      # 앱 내부자 화면 차트용 1년 종가. 매일 모든 파일이 바뀌므로 기록 없이 'prices' 브랜치에 덮어쓴다.
      - name: Chart prices
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python pipeline/signals/export_prices.py "$RUNNER_TEMP/prices"
          cd "$RUNNER_TEMP/prices"
          git init -q -b prices
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Chart prices"
          git push -f -q "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" prices
