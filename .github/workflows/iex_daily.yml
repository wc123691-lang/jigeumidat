name: IEX daily closes

on:
  schedule:
    # 15:00 KST, 화~토. IEX DEEP 공개 시각이 날마다 달라서(실측 15:30, 17:08 KST)
    # 새 파일이 나올 때까지 최대 5시간 기다렸다가 처리한다.
    - cron: "0 6 * * 2-6"
  workflow_dispatch:
    inputs:
      date:
        description: "YYYYMMDD (비우면 저장된 마지막 날짜 다음 파일을 기다려 처리)"
        required: false

permissions:
  contents: write

concurrency:
  group: iex-daily

jobs:
  closes:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Parse IEX DEEP
        env:
          DATE: ${{ inputs.date }}
        run: |
          if [ -n "$DATE" ]; then
            python pipeline/iex_daily/iex_closes.py "$DATE" --out-dir data/iex
          else
            python pipeline/iex_daily/iex_closes.py --out-dir data/iex --wait-new 5
          fi
      - name: Compute signals
        env:
          SEC_USER_AGENT: "jigeumidat ${{ github.repository_owner }}@users.noreply.github.com"
        run: python pipeline/signals/compute_signals.py
      - name: Similar periods
        run: python pipeline/signals/similar_periods.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/iex data/signals
          if git diff --cached --quiet; then
            echo "저장할 새 파일 없음"
          else
            git commit -m "IEX closes $(git diff --cached --name-only data/iex | sed 's/.*iex_//; s/.csv//' | tr '\n' ' ')"
            git pull --rebase
            git push
          fi
      # 앱 내부자 화면 차트용 1년 종가. 매일 모든 파일이 바뀌므로 기록 없이 'prices' 브랜치에 덮어쓴다.
      - name: Chart prices
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python pipeline/signals/export_prices.py "$RUNNER_TEMP/prices"
          cd "$RUNNER_TEMP/prices"
          git init -q -b prices
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Chart prices"
          git push -f -q "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" prices
