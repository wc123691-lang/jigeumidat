name: IEX daily closes

on:
  schedule:
    # 18:00 KST, 화~토 (IEX DEEP 공개 실측: 10/21분 15:30 KST, 10/22분 17:08 KST)
    # GitHub 예약 실행은 수십 분 늦게 시작될 수 있음
    - cron: "0 9 * * 2-6"
  workflow_dispatch:
    inputs:
      date:
        description: "YYYYMMDD (비우면 가장 최근 날짜)"
        required: false

jobs:
  closes:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Parse IEX DEEP
        env:
          DATE: ${{ inputs.date }}
        run: python pipeline/iex_daily/iex_closes.py $DATE
      - uses: actions/upload-artifact@v4
        with:
          name: iex-closes-${{ github.run_id }}
          path: pipeline/iex_daily/output/*.csv
          retention-days: 90
